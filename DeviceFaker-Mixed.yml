
#  Sensor Settings
#
#
#     type: the type of sensor - can be UDP, TCP, or Serial
#
#         ip: the IP the data will be sent to - required for UDP or TCP devices.
#             This will be the IP of your   CLAMS workstation.  If testing locally,
#             as is typical, this should be 127.0.0.1.
#
#      port: The port the data is sent to - required for UDP or TCP devices.
#              This must be unique for each sensor.
#
# comport: The string containing the COM port to use to send the data.
#              This is required for Serial sensor types. This is the port you
#              will send data from. This port will be connected to the CLAMS
#              serial port for this device.
#
#     baud: The baud the serial port operates at.This is required for Serial
#              sensor types
#
#       pre: Set this to a string that is prepended to the simulated values entered
#              into the textbox to send. This can be used to help simulate the output
#              of certain devices (e.g. Marel scales) OPTIONAL
#
#      post: Set this to a string that is appended to the simulated values entered
#              into the textbox to send. This can be used to help simulate the output
#              of certain devices (e.g. Marel scales) OPTIONAL

sensors:

    specimen_scale:
        type: UDP
        ip: 127.0.0.1
        port: 26000
      #  we include the pre and post values to simulate the scale output string
        pre: P01 FISH     0.000kg    0.000kg
        post: kg

    basket_scale:
        type: UDP
        ip: 127.0.0.1
        port: 26001
      #  we include the pre and post values to simulate the scale output string
        pre: P01 FISH     0.000kg    0.000kg
        post: kg

    lengthboard:
        type: Serial
        comport: COM11
        baud: 9600

    barcode:
        type: Serial
        comport: COM13
        baud: 9600
